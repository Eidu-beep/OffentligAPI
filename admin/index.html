<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eiendomsdata — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0e0f11; --surface:#16181c; --surface2:#1e2128;
    --border:#2a2d35; --text:#e8e9ec; --muted:#6b7080;
    --accent:#c8f060; --accent2:#60d4f0; --red:#f06060; --green:#60f0a0;
    --mono:'DM Mono',monospace; --serif:'Fraunces',serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.6; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:linear-gradient(rgba(200,240,96,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(200,240,96,.03) 1px,transparent 1px);
    background-size:40px 40px; }
  .wrap { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:40px 24px 80px; }
  .lbl { font-size:10px; letter-spacing:.14em; color:var(--accent); text-transform:uppercase; margin-bottom:6px; }
  h1 { font-family:var(--serif); font-size:2.4rem; font-weight:300; margin-bottom:24px; }
  h1 em { font-style:italic; color:var(--accent); }
  .login { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:20px; max-width:400px; }
  .login label { font-size:11px; color:var(--muted); display:block; margin-bottom:6px; }
  .inp { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:6px;
    padding:10px 12px; font-family:var(--mono); font-size:13px; color:var(--text); outline:none; }
  .inp:focus { border-color:var(--accent); }
  .btn { background:var(--accent); color:#0e0f11; border:none; border-radius:6px; padding:10px 18px;
    font-family:var(--mono); font-size:12px; font-weight:500; cursor:pointer; transition:opacity .15s; }
  .btn:hover { opacity:.9; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn-sm { padding:4px 10px; font-size:11px; }
  .btn-red { background:transparent; border:1px solid var(--red); color:var(--red); }
  .btn-ghost { background:transparent; border:1px solid var(--border); color:var(--muted); }
  .hidden { display:none; }
  .section { margin-bottom:32px; }
  .section-title { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:12px; }
  .form-row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .form-field { flex:1; min-width:140px; }
  .form-field label { font-size:10px; color:var(--muted); display:block; margin-bottom:4px; }
  .nokkel-rad { background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:14px 16px; margin-bottom:10px; }
  .nokkel-topp { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .nokkel-navn { font-size:14px; color:var(--text); }
  .nokkel-val { font-family:var(--mono); font-size:11px; color:var(--accent2); word-break:break-all;
    background:var(--surface2); padding:4px 8px; border-radius:4px; margin-top:6px; cursor:pointer; }
  .nokkel-meta { display:flex; gap:16px; font-size:11px; color:var(--muted); margin-top:8px; flex-wrap:wrap; }
  .nokkel-meta b { color:var(--text); font-weight:500; }
  .badge { font-size:10px; padding:2px 8px; border-radius:20px; }
  .badge-aktiv { background:rgba(96,240,160,.1); color:var(--green); border:1px solid rgba(96,240,160,.3); }
  .badge-av { background:rgba(240,96,96,.1); color:var(--red); border:1px solid rgba(240,96,96,.3); }
  .nokkel-handlinger { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .err { background:rgba(240,96,96,.1); border:1px solid rgba(240,96,96,.3); color:var(--red);
    border-radius:6px; padding:10px 14px; font-size:12px; margin-bottom:16px; }
  .ny-nokkel { background:rgba(96,240,160,.08); border:1px solid rgba(96,240,160,.3); color:var(--green);
    border-radius:6px; padding:12px 14px; font-size:12px; margin-bottom:16px; word-break:break-all; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#0e0f11; padding:8px 16px; border-radius:6px; font-size:12px;
    opacity:0; transition:opacity .2s; z-index:10; }
  .toast.vis { opacity:1; }
  .tom { color:var(--muted); font-style:italic; font-size:12px; padding:20px 0; text-align:center; }
</style>
</head>
<body>
<div class="wrap">

  <div class="lbl">// Administrasjon</div>
  <h1>API-<em>nøkler</em></h1>

  <div id="login" class="login">
    <label>Admin-nøkkel</label>
    <input class="inp" id="admin-key" type="password" placeholder="Skriv inn ADMIN_KEY" style="margin-bottom:12px">
    <button class="btn" onclick="loggInn()">Logg inn</button>
    <div id="login-err" class="err hidden" style="margin-top:12px"></div>
  </div>

  <div id="panel" class="hidden">

    <div class="section">
      <div class="section-title">Opprett ny nøkkel</div>
      <div class="card">
        <div class="form-row">
          <div class="form-field">
            <label>Kundenavn</label>
            <input class="inp" id="ny-navn" placeholder="F.eks. Min Hovednettside">
          </div>
          <div class="form-field">
            <label>E-post (valgfritt)</label>
            <input class="inp" id="ny-epost" placeholder="kunde@eksempel.no">
          </div>
          <div class="form-field">
            <label>Daglig grense (0 = ubegrenset)</label>
            <input class="inp" id="ny-grense" type="number" value="0">
          </div>
          <button class="btn" onclick="opprettNokkel()">Opprett</button>
        </div>
      </div>
      <div id="ny-nokkel-boks" class="ny-nokkel hidden"></div>
    </div>

    <div class="section">
      <div class="section-title">Eksisterende nøkler</div>
      <div id="feil" class="err hidden"></div>
      <div id="nokler"></div>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_URL = 'https://din-api.railway.app'; // ← BYTT TIL DIN RAILWAY-URL
let adminKey = '';

function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('vis');
  setTimeout(() => el.classList.remove('vis'), 1800);
}

async function api(sti, opts = {}) {
  const r = await fetch(`${API_URL}/admin${sti}`, {
    ...opts,
    headers: { 'X-Admin-Key': adminKey, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(d.feil || `HTTP ${r.status}`);
  }
  return r.json();
}

async function loggInn() {
  adminKey = document.getElementById('admin-key').value.trim();
  if (!adminKey) return;
  try {
    await api('/status');
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    lastNokler();
  } catch (e) {
    const el = document.getElementById('login-err');
    el.textContent = 'Feil admin-nøkkel eller API utilgjengelig';
    el.classList.remove('hidden');
  }
}

async function lastNokler() {
  try {
    const d = await api('/nokler');
    visNokler(d.nøkler);
  } catch (e) {
    const el = document.getElementById('feil');
    el.textContent = e.message;
    el.classList.remove('hidden');
  }
}

function visNokler(nokler) {
  const c = document.getElementById('nokler');
  if (!nokler.length) { c.innerHTML = '<div class="tom">Ingen nøkler ennå</div>'; return; }
  c.innerHTML = nokler.map(n => `
    <div class="nokkel-rad">
      <div class="nokkel-topp">
        <span class="nokkel-navn">${n.kundenavn}</span>
        <span class="badge ${n.aktiv ? 'badge-aktiv' : 'badge-av'}">${n.aktiv ? 'Aktiv' : 'Deaktivert'}</span>
      </div>
      <div class="nokkel-val" onclick="kopier('${n.nøkkel}')" title="Klikk for å kopiere">${n.nøkkel}</div>
      <div class="nokkel-meta">
        <span>Brukt i dag: <b>${n.bruktI_dag}</b></span>
        <span>Grense: <b>${n.dagligGrense}</b></span>
        ${n.epost ? `<span>E-post: <b>${n.epost}</b></span>` : ''}
        <span>Opprettet: <b>${n.opprettet.split('T')[0]}</b></span>
      </div>
      <div class="nokkel-handlinger">
        <button class="btn btn-sm btn-ghost" onclick="byttAktiv('${n.nøkkel}', ${n.aktiv ? 0 : 1})">
          ${n.aktiv ? 'Deaktiver' : 'Aktiver'}
        </button>
        <button class="btn btn-sm btn-red" onclick="slett('${n.nøkkel}', '${n.kundenavn}')">Slett</button>
      </div>
    </div>
  `).join('');
}

async function opprettNokkel() {
  const kundenavn = document.getElementById('ny-navn').value.trim();
  const epost = document.getElementById('ny-epost').value.trim();
  const dagligGrense = document.getElementById('ny-grense').value || '0';
  if (!kundenavn) { toast('Kundenavn er påkrevd'); return; }
  try {
    const ny = await api('/nokler', { method: 'POST', body: JSON.stringify({ kundenavn, epost, dagligGrense }) });
    const boks = document.getElementById('ny-nokkel-boks');
    boks.innerHTML = `Ny nøkkel opprettet — kopier den nå:<br><strong style="cursor:pointer" onclick="kopier('${ny.nøkkel}')">${ny.nøkkel}</strong>`;
    boks.classList.remove('hidden');
    document.getElementById('ny-navn').value = '';
    document.getElementById('ny-epost').value = '';
    document.getElementById('ny-grense').value = '0';
    lastNokler();
  } catch (e) { toast(e.message); }
}

async function byttAktiv(nøkkel, aktiv) {
  try {
    await api(`/nokler/${nøkkel}/aktiv`, { method: 'PATCH', body: JSON.stringify({ aktiv: !!aktiv }) });
    toast(aktiv ? 'Aktivert' : 'Deaktivert');
    lastNokler();
  } catch (e) { toast(e.message); }
}

async function slett(nøkkel, navn) {
  if (!confirm(`Slette nøkkelen til "${navn}"? Dette kan ikke angres.`)) return;
  try {
    await api(`/nokler/${nøkkel}`, { method: 'DELETE' });
    toast('Slettet');
    lastNokler();
  } catch (e) { toast(e.message); }
}

function kopier(t) {
  navigator.clipboard.writeText(t).then(() => toast('Kopiert!'));
}

document.getElementById('admin-key').addEventListener('keydown', e => { if (e.key === 'Enter') loggInn(); });
</script>
</body>
</html>
